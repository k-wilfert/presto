# GitHub Actions workflow for JDBC catalog CI
name: JDBC Catalog CI
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/jdbc-catalog-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/jdbc-catalog-ci.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
      - name: Build project and run unit tests
        run: mvn clean test -DskipITs=false
      - name: Build plugin JAR
        run: mvn package -DskipTests=true
      - name: Verify integration tests
        run: mvn failsafe:integration-test
